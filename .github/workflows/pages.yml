name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            groundhogs/package-lock.json
            star-keys/package-lock.json
            out-on-your-own/package-lock.json
      - name: Test and build Groundhogs
        working-directory: groundhogs
        run: |
          npm ci
          npx vitest run
          npm run build
      - name: Test and build Star Keys
        working-directory: star-keys
        run: |
          npm ci
          npx vitest run
          npm run build
      - name: Test and build Out in the Real World
        working-directory: out-on-your-own
        run: |
          npm ci
          npx vitest run
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r groundhogs/dist _site/groundhogs
          cp -r star-keys/dist _site/star-keys
          cp -r out-on-your-own/dist _site/out-on-your-own
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
