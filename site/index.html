<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vintage PC Games</title>
    <meta name="description" content="Browser games inspired by classic 1990s PC game genres." />
    <link rel="icon" type="image/svg+xml" href="groundhogs/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #1b120b;
        --panel: #3a2516;
        --edge: #6b4426;
        --ink: #fff4d6;
        --muted: #c9ae86;
        --accent: #9fd25a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Silkscreen', monospace;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      main { width: min(640px, 100%); }
      h1 {
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(18px, 5vw, 30px);
        line-height: 1.4;
        margin: 0 0 8px;
        color: #ffd36b;
        text-shadow: 3px 3px 0 #7a3d12;
      }
      p.sub { color: var(--muted); margin: 0 0 28px; }
      a.game {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 16px;
        background: var(--panel);
        border: 4px solid var(--edge);
        box-shadow: 0 6px 0 #120a05;
        color: inherit;
        text-decoration: none;
      }
      a.game:hover, a.game:focus-visible { border-color: var(--accent); outline: none; }
      a.game img { width: 64px; height: 64px; image-rendering: pixelated; flex: none; }
      a.game h2 { font-family: 'Press Start 2P', monospace; font-size: 16px; margin: 0 0 8px; color: var(--accent); }
      a.game span { color: var(--muted); font-size: 14px; }
      .soon { margin-top: 16px; padding: 14px 16px; border: 4px dashed var(--edge); color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Vintage PC Games</h1>
      <p class="sub">Little browser games in the spirit of the 90s.</p>
      <a class="game" href="groundhogs/">
        <img src="groundhogs/favicon.svg" alt="" />
        <div>
          <h2>Groundhogs</h2>
          <span>Get a stream of groundhogs home before the shadow falls. Dig, build, bounce and nap your way through tricky burrows.</span>
        </div>
      </a>
      <div class="soon">More games coming soon…</div>
    </main>
  </body>
</html>
